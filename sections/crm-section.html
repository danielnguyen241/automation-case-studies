<!-- Agency Operations CRM section. Copy this file plus the assets/ folder. Needs a dark background; set --ac for the accent colour. -->
<style>.crm-sec{padding:12vh 0 8vh}.crm-k{color:var(--ac,#8b5cf6);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.crm-h{font-size:clamp(30px,4vw,56px);line-height:1.05;margin:10px 0 16px}.crm-h em{font-family:"Instrument Serif",serif;font-weight:400}.crm-p{max-width:780px;font-size:clamp(16px,1.3vw,19px);opacity:.85;margin-bottom:28px}.crm-shot{border:1px solid rgba(255,255,255,.12);border-radius:14px;overflow:hidden;margin:0 0 28px}.crm-shot img{display:block;width:100%;height:auto}.crm-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;align-items:start}.crm-b{list-style:none;padding:0;margin:0}.crm-b li{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:16px}.crm-n{font-size:13px;opacity:.6;margin-top:18px}.wfcard .node{opacity:1!important;transform:none!important}@media(max-width:860px){.crm-grid{grid-template-columns:1fr}}
.wfcard{background:#0e0d14;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.wfcard header{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.wfcard header span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#0b0b10;background:var(--ac);padding:3px 9px;border-radius:99px}
.wf{overflow-x:auto}.wf svg{display:block;min-width:720px;width:100%;height:auto}
.wf .edge{stroke:#5d5876;stroke-width:2;fill:none}.wf .lbl{fill:#1c1a27;stroke:#3a3550}.wf .lt{fill:#c9c4e6;font:600 10px Figtree,sans-serif;text-anchor:middle}
.wf .node>rect:first-child{fill:#1a1924;stroke:#3a3550;stroke-width:1.2}.wf .trig>rect:first-child{stroke:#ff6d5a}
.wf .nt{fill:#f1efff;font:700 12.5px Figtree,sans-serif}.wf .ns{fill:#8e8aa6;font:500 10.5px Figtree,sans-serif}
.wf .hd{fill:#2b2838;stroke:#8e8aa6;stroke-width:1.4}
</style>
